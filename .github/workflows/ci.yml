name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint and build (all workspaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend-image:
    name: Backend container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build (non-root runtime image)
        run: docker build -f apps/backend/Dockerfile -t digitalycloud-backend:ci .
      - name: Image runs as non-root and the CLI starts
        run: |
          test "$(docker run --rm --entrypoint id digitalycloud-backend:ci -u)" != "0"
          docker run --rm digitalycloud-backend:ci node dist/cli.js | grep -q "migrate up"

  deploy:
    name: Deploy production VPS
    needs: [verify, backend-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production release
        run: bash scripts/ci/package-release.sh

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Upload and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="${VPS_USER}@${VPS_HOST}"
          remote="/opt/digitalycloud-deploy/incoming"
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          scp "${ssh_options[@]}" release-artifacts/release.tar.gz "$target:$remote/$release_id.tar.gz"
          scp "${ssh_options[@]}" scripts/ci/deploy-release.sh "$target:$remote/$release_id.sh"
          ssh "${ssh_options[@]}" "$target" "bash '$remote/$release_id.sh' '$release_id'"

      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
