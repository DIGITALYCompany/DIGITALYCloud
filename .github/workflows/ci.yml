name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and build (all workspaces)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend-image:
    name: Backend container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build (non-root runtime image)
        run: docker build -f apps/backend/Dockerfile -t digitalycloud-backend:ci .
      - name: Image runs as non-root and the CLI starts
        run: |
          test "$(docker run --rm --entrypoint id digitalycloud-backend:ci -u)" != "0"
          docker run --rm digitalycloud-backend:ci node dist/cli.js | grep -q "migrate up"
